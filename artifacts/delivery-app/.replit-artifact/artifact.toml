kind = "web"
previewPath = "/"
title = "موقع التوصيل"
version = "1.0.0"
id = "artifacts/delivery-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23152

[services.development]
run = "pnpm --filter @workspace/delivery-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/delivery-app", "run", "build" ]
publicDir = "artifacts/delivery-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23152"
BASE_PATH = "/"
